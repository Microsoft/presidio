name: Release

on:
  workflow_dispatch:

permissions: read-all

jobs:
  get-version:
    name: Get Version Numbers
    runs-on: ubuntu-slim
    outputs:
      version: ${{ steps.set-version.outputs.version }}
      image-version: ${{ steps.set-image-version.outputs.image-version }}
    steps:
      - name: Validate release branch
        if: ${{ github.ref != 'refs/heads/main' }}
        run: |
          echo "::error::Releases must be triggered from the main branch. Selected ref: ${{ github.ref }}"
          exit 1

      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.0
        with:
          persist-credentials: false

      - name: Extract main version
        id: set-version
        run: |
          set -eu
          ver=$(grep -m 1 version presidio-analyzer/pyproject.toml | tr -s ' ' | tr -d '"' | tr -d "'" | cut -d' ' -f3)
          echo "version=$ver" >> $GITHUB_OUTPUT
          echo "Main version: $ver"

      - name: Extract image-redactor version
        id: set-image-version
        run: |
          set -eu
          imageVer=$(grep -m 1 version presidio-image-redactor/pyproject.toml | tr -s ' ' | tr -d '"' | tr -d "'" | cut -d' ' -f3)
          echo "image-version=$imageVer" >> $GITHUB_OUTPUT
          echo "Image-redactor version: $imageVer"

  github-release:
    name: Create GitHub Release
    runs-on: ubuntu-slim
    needs: get-version
    permissions:
      contents: write
    continue-on-error: true
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.0
        with:
          persist-credentials: false

      - name: Create GitHub Release       
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ needs.get-version.outputs.version }}" \
            --title "Release ${{ needs.get-version.outputs.version }}" \
            --notes "" \
            --draft \
            --latest

  publish-to-pypi:
    name: Publish ${{ matrix.package.name }} to PyPI
    runs-on: ubuntu-latest 
    needs: get-version
    permissions:
      id-token: write  # Required for trusted publishing to PyPI
    strategy:
      fail-fast: false
      matrix:
        package:
          - name: "Presidio"
            path: "presidio"
          - name: "Analyzer"
            path: "presidio-analyzer"
          - name: "Anonymizer"
            path: "presidio-anonymizer"
          - name: "Image-Redactor"
            path: "presidio-image-redactor"
          - name: "Structured"
            path: "presidio-structured"
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.10'

      - name: Install build dependencies
        run: |
          pip install build==1.2.2.post1

      - name: Build wheel and sdist packages
        working-directory: ${{ matrix.package.path }}
        run: |
          python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b  # release/v1.14.0
        with:
          packages-dir: ${{ matrix.package.path }}/dist/
          skip-existing: true

  build-and-push-containers:
    name: Build and Push Container Images
    needs: get-version
    permissions:
      contents: read
      packages: write
      id-token: write
    uses: ./.github/workflows/build-images.yml
    with:
      version: ${{ needs.get-version.outputs.version }}
      image-version: ${{ needs.get-version.outputs.image-version }}
    secrets: inherit
